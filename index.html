<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zaki - Online Photobooth</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'booth-bg': '#3c342f',
                        'booth-cream': '#f5efdf',
                        'booth-accent': '#e17d6b',
                        'booth-dark': '#2a2420',
                    },
                    fontFamily: {
                        sans: ['"DM Sans"', 'sans-serif'],
                        serif: ['"Playfair Display"', 'serif'],
                    }
                }
            }
        }
    </script>
    
    <!-- Firebase SDK (Compat v9) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <!-- MediaPipe Selfie Segmentation & html2canvas -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <!-- PeerJS untuk mengirim video antar teman -->
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>

    <style>
        body {
            background-color: #3c342f;
            color: #f5efdf;
            margin: 0;
            overflow-x: hidden;
            font-family: 'DM Sans', sans-serif;
        }
        
        .ticket-btn {
            background-color: #f5efdf;
            background-image: 
                radial-gradient(circle at 0 50%, #3c342f 8px, transparent 9px),
                radial-gradient(circle at 100% 50%, #3c342f 8px, transparent 9px);
            background-position: left center, right center;
            background-repeat: no-repeat;
            background-size: 51% 100%, 51% 100%;
            border: 2px dashed #b5a995;
            color: #3c342f;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: transform 0.1s;
        }
        .ticket-btn:active { transform: scale(0.95); }

        .pattern-teddy { background-color: #f5efdf; background-image: radial-gradient(#d4a373 15%, transparent 16%); background-size: 40px 40px; }
        .pattern-hearts { background-color: #fcf6bd; background-image: radial-gradient(#e17d6b 20%, transparent 21%); background-size: 30px 30px; }
        .pattern-cherry { background-color: #a2d2ff; }
        .pattern-gingham { background-color: #a3b18a; background-image: repeating-linear-gradient(transparent, transparent 15px, rgba(255,255,255,0.3) 15px, rgba(255,255,255,0.3) 30px), repeating-linear-gradient(90deg, transparent, transparent 15px, rgba(255,255,255,0.3) 15px, rgba(255,255,255,0.3) 30px); }

        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body>
    <div id="root" class="min-h-screen w-full flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const firebaseConfig = {
            apiKey: "AIzaSyAnsmara43x_y80t--OXGKnDAjyavgGf0o",
            authDomain: "zakibooth-6f843.firebaseapp.com",
            databaseURL: "https://zakibooth-6f843-default-rtdb.firebaseio.com",
            projectId: "zakibooth-6f843",
            storageBucket: "zakibooth-6f843.appspot.com",
            messagingSenderId: "278467916314",
            appId: "1:278467916314:web:6bb82d1c19c9122a897a3"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        const LAYOUTS = [
            { id: '4cut', name: '4 cut', desc: 'the classic strip', slots: 4, cols: 1 },
            { id: '2x2', name: '2 x 2', desc: 'four, on a card', slots: 4, cols: 2 },
            { id: '2cut', name: '2 cut', desc: 'two big photos', slots: 2, cols: 1 },
            { id: 'polaroid', name: 'Polaroid', desc: 'one shot', slots: 1, cols: 1 }
        ];

        const FRAMES = [
            { id: 'simple', name: 'Simple', class: 'bg-white' },
            { id: 'teddy', name: 'Teddy', class: 'pattern-teddy' },
            { id: 'hearts', name: 'Hearts', class: 'pattern-hearts' },
            { id: 'gingham', name: 'Gingham', class: 'pattern-gingham' }
        ];

        // Pilihan Warna Latar Belakang (Background / Gorden Warna)
        const BG_COLORS = [
            { id: 'bg-green-600', name: 'Hijau Gorden', hex: '#16a34a' },
            { id: 'bg-red-600', name: 'Merah Mewah', hex: '#dc2626' },
            { id: 'bg-blue-600', name: 'Biru Elegan', hex: '#2563eb' },
            { id: 'bg-pink-500', name: 'Pink Manis', hex: '#ec4899' },
            { id: 'bg-purple-600', name: 'Ungu Regal', hex: '#9333ea' },
            { id: 'bg-neutral-900', name: 'Hitam Klasik', hex: '#171717' }
        ];

        class ErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, errorMsg: '' };
            }
            static getDerivedStateFromError(error) {
                return { hasError: true, errorMsg: error.toString() };
            }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="flex-1 flex flex-col items-center justify-center p-8 text-center bg-booth-bg min-h-screen">
                            <h2 className="text-3xl text-booth-accent font-bold mb-4">Oops! Terjadi Kesalahan</h2>
                            <p className="opacity-80 mb-6">{this.state.errorMsg}</p>
                            <button onClick={() => window.location.reload()} className="ticket-btn px-8 py-3">Refresh Halaman</button>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        const App = () => {
            const [view, setView] = useState('home'); 
            const [roomCode, setRoomCode] = useState('');
            const [joinInput, setJoinInput] = useState('');
            const [maxPeople, setMaxPeople] = useState(2);
            const [currentPeople, setCurrentPeople] = useState(1);
            const [isHost, setIsHost] = useState(false);
            
            const [selectedLayout, setSelectedLayout] = useState('4cut');
            const [selectedFrame, setSelectedFrame] = useState('simple');
            const [selectedBgColor, setSelectedBgColor] = useState('bg-green-600');
            
            const videoRef = useRef(null);
            const canvasRef = useRef(null); 
            const resultRef = useRef(null);
            const remoteVids = useRef([]);
            const offscreenCanvasRef = useRef(null);

            const [isCameraReady, setIsCameraReady] = useState(false);
            const [countdown, setCountdown] = useState(null);
            const [photos, setPhotos] = useState([]);
            
            const [triggerCaptureState, setTriggerCaptureState] = useState(null);
            const lastProcessedTrigger = useRef(null);

            useEffect(() => {
                const offscreen = document.createElement('canvas');
                offscreen.width = 640;
                offscreen.height = 480;
                offscreenCanvasRef.current = offscreen;
            }, []);

            useEffect(() => {
                if (!roomCode) return;
                const roomRef = db.ref('rooms/' + roomCode);

                const handleValue = (snapshot) => {
                    const data = snapshot.val();
                    if (data) {
                        if (data.participants) setCurrentPeople(data.participants);
                        if (data.layout) setSelectedLayout(data.layout);
                        if (data.frame) setSelectedFrame(data.frame);
                        if (data.bgColor) setSelectedBgColor(data.bgColor);
                        if (data.triggerCapture) setTriggerCaptureState(data.triggerCapture);

                        if (!isHost) {
                            setView(prevView => {
                                if (data.status === 'camera' && prevView === 'lobby') return 'camera';
                                if (data.status === 'setup-bg' && prevView === 'setup-frame') return 'setup-bg';
                                if (data.status === 'booth' && (prevView === 'setup-size' || prevView === 'setup-frame' || prevView === 'setup-bg')) return 'booth';
                                return prevView;
                            });
                        }
                    }
                };

                roomRef.on('value', handleValue);
                return () => roomRef.off('value', handleValue);
            }, [roomCode, isHost]);

            useEffect(() => {
                if (triggerCaptureState && triggerCaptureState !== lastProcessedTrigger.current) {
                    lastProcessedTrigger.current = triggerCaptureState;
                    if (!isHost) takePhotoSequence();
                }
            }, [triggerCaptureState]);

            const generateCode = () => Math.random().toString(36).substring(2, 6).toUpperCase();

            const handleCreateClick = () => {
                const code = generateCode();
                setIsHost(true);
                setRoomCode(code);
                
                db.ref('rooms/' + code).set({
                    status: 'waiting',
                    participants: 1,
                    maxPeople: 2,
                    layout: '4cut',
                    frame: 'simple',
                    bgColor: 'bg-green-600'
                }).catch(err => console.error("Firebase Error:", err));

                setView('set-people');
            };

            const handleJoinClick = () => {
                const code = joinInput.trim().toUpperCase();
                if(code.length === 4) {
                    const roomRef = db.ref('rooms/' + code);
                    roomRef.once('value', (snapshot) => {
                        if (snapshot.exists()) {
                            setIsHost(false);
                            setRoomCode(code);
                            
                            const current = snapshot.val().participants || 1;
                            roomRef.update({ participants: current + 1 });
                            setView('lobby');
                        } else {
                            alert("Room tidak ditemukan! Periksa kembali kode ruangan.");
                        }
                    }).catch(err => alert("Gagal koneksi ke database."));
                } else {
                    alert("Masukkan 4 digit kode yang valid.");
                }
            };

            const handleSetPeople = (num) => {
                setMaxPeople(num);
                db.ref('rooms/' + roomCode).update({ maxPeople: num });
                setView('lobby');
            };

            const handleStartRoom = () => {
                db.ref('rooms/' + roomCode).update({ status: 'camera' });
                setView('camera');
            };

            const handleActivateCamera = async () => {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                    stream.getTracks().forEach(track => track.stop());
                    
                    if (isHost) {
                        db.ref('rooms/' + roomCode).update({ status: 'setup-size' });
                        setView('setup-size');
                    } else {
                        db.ref('rooms/' + roomCode).once('value', snap => {
                            const data = snap.val();
                            const currentStatus = data ? data.status : null;
                            if (currentStatus === 'setup-frame' || currentStatus === 'setup-bg' || currentStatus === 'booth') {
                                setView(currentStatus);
                            } else {
                                setView('setup-size');
                            }
                        });
                    }
                } catch (err) {
                    alert("Gagal mengaktifkan kamera. Pastikan browser mengizinkan akses kamera.");
                }
            };

            const startCameraAndAI = async () => {
                try {
                    if (typeof SelfieSegmentation === 'undefined') {
                        throw new Error("Sistem AI belum selesai dimuat. Coba refresh halaman.");
                    }

                    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                    if (videoRef.current) {
                        videoRef.current.srcObject = stream;
                        
                        const selfieSegmentation = new SelfieSegmentation({
                            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${file}`
                        });
                        selfieSegmentation.setOptions({ modelSelection: 1 });
                        
                        selfieSegmentation.onResults((results) => {
                            if(!canvasRef.current || !offscreenCanvasRef.current) return;
                            const w = canvasRef.current.width;
                            const h = canvasRef.current.height;
                            
                            const offCtx = offscreenCanvasRef.current.getContext('2d');
                            offCtx.save();
                            offCtx.clearRect(0, 0, w, h);
                            offCtx.translate(w, 0);
                            offCtx.scale(-1, 1);
                            offCtx.globalCompositeOperation = 'source-over';
                            offCtx.drawImage(results.segmentationMask, 0, 0, w, h);
                            offCtx.globalCompositeOperation = 'source-in';
                            offCtx.drawImage(results.image, 0, 0, w, h);
                            offCtx.restore();

                            const mainCtx = canvasRef.current.getContext('2d');
                            mainCtx.clearRect(0, 0, w, h);
                            
                            remoteVids.current.forEach(rv => {
                                if(rv.readyState >= 2) mainCtx.drawImage(rv, 0, 0, w, h);
                            });
                            
                            mainCtx.drawImage(offscreenCanvasRef.current, 0, 0, w, h);
                        });

                        const sendFrame = async () => {
                            if (!videoRef.current || videoRef.current.paused) return;
                            try {
                                await selfieSegmentation.send({image: videoRef.current});
                            } catch (e) { }
                            requestAnimationFrame(sendFrame);
                        };

                        videoRef.current.onloadeddata = () => {
                            videoRef.current.play();
                            setIsCameraReady(true);
                            sendFrame();
                            
                            const localStream = offscreenCanvasRef.current.captureStream(30);
                            
                            if (isHost) {
                                const peer = new Peer(`zakibooth-${roomCode}`);
                                peer.on('error', (err) => console.log("PeerJS Error:", err));
                                peer.on('call', (call) => {
                                    call.answer(localStream);
                                    call.on('stream', (remoteStream) => {
                                        const rv = document.createElement('video');
                                        rv.autoplay = true; rv.playsInline = true; rv.muted = true;
                                        rv.srcObject = remoteStream;
                                        rv.onloadedmetadata = () => rv.play();
                                        remoteVids.current.push(rv);
                                    });
                                });
                            } else {
                                const peer = new Peer();
                                peer.on('error', (err) => console.log("PeerJS Error:", err));
                                peer.on('open', () => {
                                    const call = peer.call(`zakibooth-${roomCode}`, localStream);
                                    if(call) {
                                        call.on('stream', (remoteStream) => {
                                            const rv = document.createElement('video');
                                            rv.autoplay = true; rv.playsInline = true; rv.muted = true;
                                            rv.srcObject = remoteStream;
                                            rv.onloadedmetadata = () => rv.play();
                                            remoteVids.current.push(rv);
                                        });
                                    }
                                });
                            }
                        };
                    }
                } catch (err) {
                    alert(err.message || "Terjadi kesalahan saat memuat kamera AI.");
                }
            };

            useEffect(() => {
                if (view === 'booth') {
                    startCameraAndAI();
                }
            }, [view]);

            const takePhotoSequence = async () => {
                const foundLayout = LAYOUTS.find(l => l.id === selectedLayout);
                const layout = foundLayout ? foundLayout : LAYOUTS[0];
                let currentShots = [];
                
                for(let i = 0; i < layout.slots; i++) {
                    for(let c = 3; c > 0; c--) {
                        setCountdown(c);
                        await new Promise(r => setTimeout(r, 1000));
                    }
                    setCountdown('CHEESE!');
                    
                    const imgData = canvasRef.current.toDataURL('image/png');
                    currentShots.push(imgData);
                    setPhotos([...currentShots]);
                    
                    await new Promise(r => setTimeout(r, 1000));
                    setCountdown(null);
                }
                
                if (videoRef.current && videoRef.current.srcObject) {
                    videoRef.current.srcObject.getTracks().forEach(track => track.stop());
                }
                
                setView('result');
            };

            const downloadImage = () => {
                if (resultRef.current) {
                    html2canvas(resultRef.current, { scale: 2, useCORS: true }).then(canvas => {
                        const link = document.createElement('a');
                        link.download = 'zaki-photobooth.png';
                        link.href = canvas.toDataURL('image/png');
                        link.click();
                    });
                }
            };

            // ================== RENDER VIEWS ==================

            if (view === 'home') {
                return (
                    <div className="flex-1 flex flex-col items-center justify-center p-6 space-y-8">
                        <h1 className="font-serif text-6xl font-bold mb-4 text-booth-cream tracking-wider">Zaki</h1>
                        <button onClick={handleCreateClick} className="ticket-btn w-64 py-4 text-center rounded">
                            Buat Room
                        </button>
                        <div className="flex items-center space-x-2 text-booth-cream opacity-50 w-64">
                            <hr className="flex-1 border-current" />
                            <span>OR</span>
                            <hr className="flex-1 border-current" />
                        </div>
                        <div className="w-64 flex flex-col space-y-3">
                            <input 
                                type="text" 
                                placeholder="ENTER CODE" 
                                className="w-full bg-booth-dark border border-booth-cream/30 rounded py-3 px-4 text-center uppercase tracking-widest outline-none focus:border-booth-accent text-white"
                                maxLength={4}
                                value={joinInput}
                                onChange={(e) => setJoinInput(e.target.value)}
                            />
                            <button onClick={handleJoinClick} className="bg-booth-cream text-booth-dark font-bold rounded w-full py-3">
                                Join Room
                            </button>
                        </div>
                    </div>
                );
            }

            if (view === 'set-people') {
                return (
                    <div className="flex-1 flex flex-col items-center justify-center p-6 space-y-8">
                        <h2 className="font-serif text-3xl mb-4">Mau berapa orang????</h2>
                        <div className="grid grid-cols-2 gap-4 w-64">
                            {[1, 2, 3, 4].map(num => (
                                <button 
                                    key={num} 
                                    onClick={() => handleSetPeople(num)}
                                    className="border-2 border-booth-cream/30 hover:border-booth-accent bg-booth-dark text-xl py-6 rounded-xl transition"
                                >
                                    {num}
                                </button>
                            ))}
                        </div>
                    </div>
                );
            }

            if (view === 'lobby') {
                return (
                    <div className="flex-1 flex flex-col items-center justify-center p-6 text-center">
                        <h2 className="font-serif text-3xl mb-2">kode room</h2>
                        <div className="text-6xl font-bold tracking-widest text-booth-accent bg-booth-dark border-2 border-booth-cream/20 px-8 py-4 rounded-xl shadow-lg">
                            {roomCode}
                        </div>
                        <div className="mt-12 bg-booth-dark p-6 rounded-xl w-64 border border-booth-cream/10">
                            <h3 className="text-lg opacity-80 mb-2">Participants</h3>
                            <div className="text-3xl font-serif text-booth-cream">
                                {isHost ? `${currentPeople} / ${maxPeople}` : 'Joined!'}
                            </div>
                            <p className="text-sm opacity-50 mt-2">
                                {isHost ? "Bagikan kode ini ke temanmu" : "Menunggu Host memulai..."}
                            </p>
                        </div>
                        {isHost && (
                            <button onClick={handleStartRoom} className="ticket-btn w-64 py-4 mt-8 text-lg">
                                Lanjut
                            </button>
                        )}
                    </div>
                );
            }

            if (view === 'camera') {
                return (
                    <div className="flex-1 flex flex-col items-center justify-center p-6 text-center">
                        <div className="w-20 h-20 border-4 border-booth-accent border-t-transparent rounded-full animate-spin mb-6"></div>
                        <h2 className="font-serif text-2xl">Siap Menggunakan Kamera</h2>
                        <p className="opacity-70 mt-4 max-w-xs mx-auto">Klik tombol di bawah untuk mengaktifkan kamera Anda.</p>
                        <button onClick={handleActivateCamera} className="bg-booth-accent text-white font-bold rounded-lg px-8 py-4 mt-8 shadow-lg active:scale-95 transition">
                            Aktifkan Kamera
                        </button>
                    </div>
                );
            }

            if (view === 'setup-size') {
                return (
                    <div className="flex-1 flex flex-col p-6 max-w-md mx-auto w-full">
                        <div className="flex items-center justify-center mb-8 relative">
                            <h2 className="font-serif text-3xl">Pilih ukuran</h2>
                        </div>
                        <p className="text-center opacity-70 mb-6">
                            {isHost ? "Host: Tap one to choose." : "Menunggu Host memilih ukuran..."}
                        </p>
                        <div className="grid grid-cols-2 gap-4 flex-1">
                            {LAYOUTS.map(l => (
                                <div key={l.id} 
                                   onClick={() => {
                                       if(isHost) {
                                           setSelectedLayout(l.id);
                                           db.ref('rooms/' + roomCode).update({ layout: l.id });
                                       }
                                   }}
                                   className={`border-2 rounded-xl p-4 flex flex-col items-center justify-center transition shadow-md 
                                     ${selectedLayout === l.id ? 'border-booth-accent bg-booth-dark' : 'border-booth-cream/10 bg-booth-bg'} 
                                     ${isHost ? 'cursor-pointer' : 'opacity-80'}`}>
                                    <h3 className="font-bold text-xl">{l.name}</h3>
                                    <p className="text-sm opacity-70 text-center">{l.desc}</p>
                                </div>
                            ))}
                        </div>
                        <div className="mt-8 flex justify-center pb-8 min-h-[60px]">
                            {isHost && (
                                <button onClick={() => {
                                    db.ref('rooms/' + roomCode).update({ status: 'setup-frame' });
                                    setView('setup-frame');
                                }} className="ticket-btn w-48 py-3">Next</button>
                            )}
                        </div>
                    </div>
                );
            }

            if (view === 'setup-frame') {
                return (
                    <div className="flex-1 flex flex-col p-6 max-w-md mx-auto w-full">
                        <div className="flex items-center justify-center mb-6 relative">
                            {isHost && <button onClick={() => {
                                db.ref('rooms/' + roomCode).update({ status: 'setup-size' });
                                setView('setup-size');
                            }} className="absolute left-0 opacity-70">← Back</button>}
                            <h2 className="font-serif text-3xl">Pilih frame</h2>
                        </div>
                        <p className="text-center opacity-70 mb-6">
                            {isHost ? "Host: Tap one to choose." : "Menunggu Host memilih template..."}
                        </p>
                        <div className="grid grid-cols-2 gap-4 flex-1 overflow-y-auto hide-scrollbar">
                            {FRAMES.map(f => (
                                <div key={f.id} 
                                   onClick={() => {
                                       if(isHost) {
                                           setSelectedFrame(f.id);
                                           db.ref('rooms/' + roomCode).update({ frame: f.id });
                                       }
                                   }}
                                   className={`border-4 rounded-xl h-48 transition flex flex-col items-center justify-end p-2 shadow-lg 
                                     ${selectedFrame === f.id ? 'border-booth-accent' : 'border-booth-cream/10'} ${f.class}
                                     ${isHost ? 'cursor-pointer' : 'opacity-80'}`}>
                                    <span className="bg-black/60 text-white px-3 py-1 rounded text-sm mb-2">{f.name}</span>
                                </div>
                            ))}
                        </div>
                        <div className="mt-8 flex justify-center pb-8 min-h-[60px]">
                            {isHost && (
                                <button onClick={() => {
                                    db.ref('rooms/' + roomCode).update({ status: 'setup-bg' });
                                    setView('setup-bg');
                                }} className="ticket-btn w-48 py-3">lanjut</button>
                            )}
                        </div>
                    </div>
                );
            }

            // --- PILIHAN WARNA LATAR BELAKANG / GORDEN ---
            if (view === 'setup-bg') {
                return (
                    <div className="flex-1 flex flex-col p-6 max-w-md mx-auto w-full">
                        <div className="flex items-center justify-center mb-6 relative">
                            {isHost && <button onClick={() => {
                                db.ref('rooms/' + roomCode).update({ status: 'setup-frame' });
                                setView('setup-frame');
                            }} className="absolute left-0 opacity-70">← Back</button>}
                            <h2 className="font-serif text-3xl">Pilih Background</h2>
                        </div>
                        <p className="text-center opacity-70 mb-6">
                            {isHost ? "Host: Pilih warna latar belakang/gorden" : "Menunggu Host memilih background..."}
                        </p>
                        <div className="grid grid-cols-2 gap-4 flex-1 overflow-y-auto hide-scrollbar">
                            {BG_COLORS.map(bg => (
                                <div key={bg.id} 
                                   onClick={() => {
                                       if(isHost) {
                                           setSelectedBgColor(bg.id);
                                           db.ref('rooms/' + roomCode).update({ bgColor: bg.id });
                                       }
                                   }}
                                   className={`border-4 rounded-xl h-36 transition flex flex-col items-center justify-end p-3 shadow-lg ${bg.id}
                                     ${selectedBgColor === bg.id ? 'border-booth-cream scale-105' : 'border-transparent'}
                                     ${isHost ? 'cursor-pointer' : 'opacity-80'}`}>
                                    <span className="bg-black/60 text-white px-3 py-1 rounded text-sm mb-1">{bg.name}</span>
                                </div>
                            ))}
                        </div>
                        <div className="mt-8 flex justify-center pb-8 min-h-[60px]">
                            {isHost && (
                                <button onClick={() => {
                                    db.ref('rooms/' + roomCode).update({ status: 'booth' });
                                    setView('booth');
                                }} className="ticket-btn w-48 py-3">enter tombol</button>
                            )}
                        </div>
                    </div>
                );
            }

            if (view === 'booth') {
                return (
                    // Latar belakang berubah sesuai warna gorden/background yang dipilih Host!
                    <div className={`flex-1 flex flex-col items-center justify-center relative ${selectedBgColor}`}>
                        <video ref={videoRef} className="hidden" playsInline autoPlay muted></video>
                        
                        <canvas ref={canvasRef} width="640" height="480" className="w-full h-full object-cover"></canvas>
                        
                        {!isCameraReady && (
                            <div className="absolute inset-0 flex flex-col items-center justify-center z-10 bg-black/80 text-white">
                                <div className="w-12 h-12 border-4 border-booth-accent border-t-transparent rounded-full animate-spin mb-4"></div>
                                <p>Menyiapkan Kamera dan Koneksi</p>
                            </div>
                        )}

                        {countdown && (
                            <div className="absolute inset-0 flex items-center justify-center text-9xl font-bold text-white z-20" 
                                 style={{ textShadow: '0 4px 20px rgba(0,0,0,0.8), 2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000' }}>
                                {countdown}
                            </div>
                        )}
                        
                        {isCameraReady && !countdown && photos.length === 0 && (
                            <div className="absolute bottom-12 z-20">
                                {isHost ? (
                                    <button onClick={() => {
                                        db.ref('rooms/' + roomCode).update({ triggerCapture: Date.now() });
                                        takePhotoSequence();
                                    }} className="w-20 h-20 bg-white rounded-full border-4 border-booth-accent shadow-[0_0_20px_rgba(225,125,107,0.8)] transition active:scale-90"></button>
                                ) : (
                                    <div className="bg-black/80 text-white px-6 py-3 rounded-full text-sm font-bold border border-white/20">
                                        Menunggu Host mencet foto
                                    </div>
                                )}
                            </div>
                        )}
                    </div>
                );
            }

            if (view === 'result') {
                const foundLayout = LAYOUTS.find(l => l.id === selectedLayout);
                const layoutObj = foundLayout ? foundLayout : LAYOUTS[0];
                
                const foundFrame = FRAMES.find(f => f.id === selectedFrame);
                const frameClass = foundFrame ? foundFrame.class : 'bg-white';
                
                return (
                    <div className="flex-1 flex flex-col items-center p-6 overflow-y-auto">
                        <h2 className="font-serif text-3xl mb-6 mt-4">foto lu</h2>
                        
                        <div ref={resultRef} className={`p-4 shadow-2xl rounded-md flex flex-col gap-2 ${frameClass}`} 
                             style={{ width: layoutObj.cols === 2 ? '300px' : '220px' }}>
                            
                            <div className={`grid gap-2`} style={{ gridTemplateColumns: `repeat(${layoutObj.cols}, minmax(0, 1fr))` }}>
                                {photos.map((p, i) => (
                                    // Kotak foto menggunakan warna background pilihan agar menyatu sempurna
                                    <div key={i} className={`aspect-[4/3] ${selectedBgColor} overflow-hidden relative shadow-inner rounded-sm border border-black/10`}>
                                        <img src={p} className="w-full h-full object-cover" />
                                    </div>
                                ))}
                            </div>
                            
                            <div className="text-center font-serif text-sm mt-3 font-bold text-black/60 tracking-widest">
                                ZAKI BOOTH
                            </div>
                        </div>
                        
                        <div className="flex flex-col gap-3 mt-8 w-64">
                            <button onClick={downloadImage} className="ticket-btn w-full py-3 shadow-lg">
                                Unduh Foto
                            </button>
                            <button onClick={() => window.location.reload()} className="text-booth-cream border-2 border-booth-cream py-3 rounded font-bold uppercase tracking-wider active:bg-booth-cream active:text-booth-dark transition">
                                Home
                            </button>
                        </div>
                    </div>
                );
            }

            return null;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ErrorBoundary><App /></ErrorBoundary>);
    </script>
</body>
</html>
