<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Angie - Online Photobooth</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- MediaPipe Selfie Segmentation (Hapus Background) -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js" crossorigin="anonymous"></script>

    <!-- PeerJS untuk Multiplayer Jarak Jauh -->
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'booth-bg': '#3c342f',
                        'booth-cream': '#f5efdf',
                        'booth-accent': '#e17d6b',
                        'booth-dark': '#2a2420',
                    },
                    fontFamily: {
                        sans: ['"DM Sans"', 'sans-serif'],
                        serif: ['"Playfair Display"', 'serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #3c342f; color: #f5efdf; margin: 0; overflow-x: hidden; font-family: 'DM Sans', sans-serif; }
        .ticket-btn {
            background-color: #f5efdf;
            background-image: radial-gradient(circle at 0 50%, #3c342f 8px, transparent 9px), radial-gradient(circle at 100% 50%, #3c342f 8px, transparent 9px);
            background-position: left center, right center; background-repeat: no-repeat; background-size: 51% 100%, 51% 100%;
            border: 2px dashed #b5a995; color: #3c342f; font-weight: bold; text-transform: uppercase; letter-spacing: 2px; transition: transform 0.1s;
        }
        .ticket-btn:active { transform: scale(0.95); }
        .ticket-btn:disabled { opacity: 0.5; pointer-events: none; }
        .pattern-teddy { background-color: #f5efdf; background-image: radial-gradient(#d4a373 15%, transparent 16%); background-size: 40px 40px; }
        .pattern-hearts { background-color: #fcf6bd; background-image: radial-gradient(#e17d6b 20%, transparent 21%); background-size: 30px 30px; }
        .pattern-cherry { background-color: #a2d2ff; }
        .pattern-gingham { background-color: #a3b18a; background-image: repeating-linear-gradient(transparent, transparent 15px, rgba(255,255,255,0.3) 15px, rgba(255,255,255,0.3) 30px), repeating-linear-gradient(90deg, transparent, transparent 15px, rgba(255,255,255,0.3) 15px, rgba(255,255,255,0.3) 30px); }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body>
    <div id="root" class="min-h-screen w-full flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const LAYOUTS = [
            { id: '4cut', name: '4 cut', desc: 'the classic strip', slots: 4, cols: 1 },
            { id: '2x2', name: '2 x 2', desc: 'four, on a card', slots: 4, cols: 2 },
            { id: '2cut', name: '2 cut', desc: 'two big photos', slots: 2, cols: 1 },
            { id: 'polaroid', name: 'Polaroid', desc: 'one shot', slots: 1, cols: 1 }
        ];

        const FRAMES = [
            { id: 'simple', name: 'Simple', class: 'bg-white' },
            { id: 'teddy', name: 'Teddy', class: 'pattern-teddy' },
            { id: 'hearts', name: 'Hearts', class: 'pattern-hearts' },
            { id: 'gingham', name: 'Gingham', class: 'pattern-gingham' }
        ];

        const App = () => {
            const [view, setView] = useState('home'); 
            
            // State Multiplayer
            const [roomCode, setRoomCode] = useState('');
            const [joinInput, setJoinInput] = useState('');
            const [isHost, setIsHost] = useState(false);
            const [peer, setPeer] = useState(null);
            const [connection, setConnection] = useState(null);
            const [remoteStream, setRemoteStream] = useState(null);
            
            // State Booth
            const [selectedLayout, setSelectedLayout] = useState('4cut');
            const [selectedFrame, setSelectedFrame] = useState('simple');
            
            const rawVideoRef = useRef(null); // Video asli
            const localCanvasRef = useRef(null); // Canvas tanpa BG (milik sendiri)
            const remoteVideoRef = useRef(null); // Video teman tanpa BG
            
            const [isCameraReady, setIsCameraReady] = useState(false);
            const [countdown, setCountdown] = useState(null);
            const [photos, setPhotos] = useState([]);

            const generateCode = () => Math.random().toString(36).substring(2, 6).toUpperCase();

            // ================= MULTIPLAYER LOGIC (PEERJS) =================
            const handleCreateClick = () => {
                const code = generateCode();
                setRoomCode(code);
                setIsHost(true);
                setView('lobby');

                // Inisiasi Server PeerJS untuk Host
                const newPeer = new Peer(`angiebooth-${code}`);
                
                newPeer.on('open', (id) => {
                    console.log('Host siap dengan ID:', id);
                });

                newPeer.on('connection', (conn) => {
                    setConnection(conn);
                    
                    conn.on('data', (data) => {
                        handleIncomingData(data);
                    });
                    
                    // Teman join, pindah ke layar kamera bareng-bareng
                    setView('camera'); 
                });

                newPeer.on('call', (call) => {
                    // Ketika teman mengirim videonya, kita angkat dan kirim video kita
                    const myStream = localCanvasRef.current.captureStream(30);
                    call.answer(myStream);
                    
                    call.on('stream', (userVideoStream) => {
                        setRemoteStream(userVideoStream);
                    });
                });

                setPeer(newPeer);
            };

            const handleJoinClick = () => {
                const code = joinInput.toUpperCase();
                if(code.length !== 4) return alert("Masukkan 4 digit kode yang valid.");
                
                setRoomCode(code);
                setIsHost(false);
                setView('camera'); // Langsung masuk layar kamera

                // Inisiasi Server PeerJS untuk Guest
                const newPeer = new Peer();
                
                newPeer.on('open', (id) => {
                    // Konek ke Host
                    const conn = newPeer.connect(`angiebooth-${code}`);
                    
                    conn.on('open', () => {
                        setConnection(conn);
                    });

                    conn.on('data', (data) => {
                        handleIncomingData(data);
                    });
                });

                setPeer(newPeer);
            };

            // Menangani Data Sinkronisasi Jarak Jauh
            const handleIncomingData = (data) => {
                if (data.type === 'SYNC_VIEW') setView(data.view);
                if (data.type === 'SYNC_LAYOUT') setSelectedLayout(data.layout);
                if (data.type === 'SYNC_FRAME') setSelectedFrame(data.frame);
                if (data.type === 'TAKE_PHOTO') startPhotoSequence();
            };

            const syncData = (data) => {
                if (connection && connection.open) {
                    connection.send(data);
                }
            };

            // ================= CAMERA & AI LOGIC =================
            const startCameraAndAI = async () => {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false });
                    
                    if (rawVideoRef.current) {
                        rawVideoRef.current.srcObject = stream;
                        
                        const selfieSegmentation = new SelfieSegmentation({
                            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${file}`
                        });
                        selfieSegmentation.setOptions({ modelSelection: 1 });
                        
                        selfieSegmentation.onResults((results) => {
                            if(!localCanvasRef.current) return;
                            const ctx = localCanvasRef.current.getContext('2d');
                            const w = localCanvasRef.current.width;
                            const h = localCanvasRef.current.height;
                            
                            ctx.save();
                            ctx.clearRect(0, 0, w, h);
                            ctx.translate(w, 0);
                            ctx.scale(-1, 1); // Mirror
                            
                            // Masking Background jadi Transparan
                            ctx.globalCompositeOperation = 'source-over';
                            ctx.drawImage(results.segmentationMask, 0, 0, w, h);
                            ctx.globalCompositeOperation = 'source-in';
                            ctx.drawImage(results.image, 0, 0, w, h);
                            ctx.restore();
                        });

                        const sendFrame = async () => {
                            if (!rawVideoRef.current || rawVideoRef.current.paused) return;
                            await selfieSegmentation.send({image: rawVideoRef.current});
                            requestAnimationFrame(sendFrame);
                        };

                        rawVideoRef.current.onloadeddata = () => {
                            rawVideoRef.current.play();
                            setIsCameraReady(true);
                            sendFrame();
                            
                            // Jika saya Guest, telpon Host dan kirim video tanpa background saya
                            if (!isHost && peer) {
                                const myStream = localCanvasRef.current.captureStream(30);
                                const call = peer.call(`angiebooth-${roomCode}`, myStream);
                                
                                call.on('stream', (hostVideoStream) => {
                                    setRemoteStream(hostVideoStream);
                                });
                            }
                        };
                    }
                } catch (err) {
                    alert("Akses kamera dibutuhkan.");
                }
            };

            // Pasang stream teman ke elemen video
            useEffect(() => {
                if (remoteStream && remoteVideoRef.current) {
                    remoteVideoRef.current.srcObject = remoteStream;
                }
            }, [remoteStream, view]);

            // ================= NAVIGATION LOGIC =================
            const gotoSetupSize = () => {
                setView('setup-size');
                syncData({ type: 'SYNC_VIEW', view: 'setup-size' });
            };

            const selectLayout = (id) => {
                if (!isHost) return; // Hanya host yg bisa milih
                setSelectedLayout(id);
                syncData({ type: 'SYNC_LAYOUT', layout: id });
            };

            const gotoSetupFrame = () => {
                setView('setup-frame');
                syncData({ type: 'SYNC_VIEW', view: 'setup-frame' });
            };

            const selectFrame = (id) => {
                if (!isHost) return;
                setSelectedFrame(id);
                syncData({ type: 'SYNC_FRAME', frame: id });
            };

            const gotoBooth = () => {
                setView('booth');
                syncData({ type: 'SYNC_VIEW', view: 'booth' });
            };

            const triggerPhotoSequence = () => {
                startPhotoSequence();
                syncData({ type: 'TAKE_PHOTO' });
            };

            const startPhotoSequence = async () => {
                // Gunakan state layout yang terbaru di dlm fungsi asinkron
                setSelectedLayout(currentLayout => {
                    executePhotoCapture(currentLayout);
                    return currentLayout;
                });
            };

            const executePhotoCapture = async (activeLayout) => {
                const layoutObj = LAYOUTS.find(l => l.id === activeLayout);
                let currentShots = [];
                
                for(let i = 0; i < layoutObj.slots; i++) {
                    for(let c = 3; c > 0; c--) {
                        setCountdown(c);
                        await new Promise(r => setTimeout(r, 1000));
                    }
                    setCountdown('CHEESE!');
                    
                    // GABUNGKAN KAMERA SENDIRI & KAMERA TEMAN
                    const finalCanvas = document.createElement('canvas');
                    finalCanvas.width = 640;
                    finalCanvas.height = 480;
                    const ctx = finalCanvas.getContext('2d');
                    
                    // Gambar diri sendiri
                    if (localCanvasRef.current) {
                        ctx.drawImage(localCanvasRef.current, 0, 0, 640, 480);
                    }
                    
                    // Gambar teman (karena backgroundnya transparan, mereka akan menumpuk!)
                    if (remoteVideoRef.current && remoteStream) {
                        ctx.drawImage(remoteVideoRef.current, 0, 0, 640, 480);
                    }
                    
                    const imgData = finalCanvas.toDataURL('image/png');
                    currentShots.push(imgData);
                    setPhotos([...currentShots]);
                    
                    await new Promise(r => setTimeout(r, 1000));
                    setCountdown(null);
                }
                
                setView('result');
            };

            // ================== RENDER VIEWS ==================

            if (view === 'home') {
                return (
                    <div className="flex-1 flex flex-col items-center justify-center p-6 space-y-8">
                        <h1 className="font-serif text-6xl font-bold mb-4 text-booth-cream tracking-wider">Angie</h1>
                        
                        <button onClick={handleCreateClick} className="ticket-btn w-64 py-4 text-center rounded">
                            Create Room
                        </button>
                        
                        <div className="flex items-center space-x-2 text-booth-cream opacity-50 w-64">
                            <hr className="flex-1 border-current" />
                            <span>OR</span>
                            <hr className="flex-1 border-current" />
                        </div>

                        <div className="w-64 flex flex-col space-y-3">
                            <input 
                                type="text" 
                                placeholder="ENTER CODE" 
                                className="w-full bg-booth-dark border border-booth-cream/30 rounded py-3 px-4 text-center uppercase tracking-widest outline-none focus:border-booth-accent text-white"
                                maxLength={4}
                                value={joinInput}
                                onChange={(e) => setJoinInput(e.target.value)}
                            />
                            <button onClick={handleJoinClick} className="bg-booth-cream text-booth-dark font-bold rounded w-full py-3">
                                Join Room
                            </button>
                        </div>
                    </div>
                );
            }

            if (view === 'lobby') {
                return (
                    <div className="flex-1 flex flex-col items-center justify-center p-6 text-center">
                        <h2 className="font-serif text-3xl mb-2">Room Code</h2>
                        <div className="text-6xl font-bold tracking-widest text-booth-accent bg-booth-dark border-2 border-booth-cream/20 px-8 py-4 rounded-xl shadow-lg">
                            {roomCode}
                        </div>
                        <p className="mt-8 opacity-70">Menunggu teman memasukkan kode ini...</p>
                        <div className="mt-4 w-12 h-12 border-4 border-booth-accent border-t-transparent rounded-full animate-spin mx-auto"></div>
                    </div>
                );
            }

            if (view === 'camera') {
                return (
                    <div className="flex-1 flex flex-col items-center justify-center p-6 text-center">
                        <h2 className="font-serif text-3xl mb-4">Akses Kamera</h2>
                        <p className="opacity-70 mb-8 max-w-xs mx-auto">Klik tombol di bawah untuk menyalakan AI penghapus background.</p>
                        
                        {/* Tersembunyi: Canvas Lokal & Video Teman */}
                        <video ref={rawVideoRef} className="hidden" playsInline muted></video>
                        <canvas ref={localCanvasRef} width="640" height="480" className="hidden"></canvas>
                        
                        <button onClick={() => {
                            startCameraAndAI();
                            if(isHost) setTimeout(gotoSetupSize, 2500); // Host otomatis lanjut setelah kamera nyala
                        }} className="ticket-btn w-64 py-4 rounded font-bold">
                            Nyalakan Kamera
                        </button>
                        
                        {!isHost && <p className="mt-8 text-sm opacity-50">Menunggu Host memilih layout...</p>}
                    </div>
                );
            }

            if (view === 'setup-size') {
                return (
                    <div className="flex-1 flex flex-col p-6 max-w-md mx-auto w-full">
                        <h2 className="font-serif text-3xl text-center mb-2">Pick a size</h2>
                        <p className="text-center opacity-70 mb-8">{isHost ? "Host: Tap one" : "Menunggu Host memilih..."}</p>
                        
                        <div className="grid grid-cols-2 gap-4 flex-1">
                            {LAYOUTS.map(l => (
                                <div key={l.id} 
                                     onClick={() => selectLayout(l.id)}
                                     className={`border-2 rounded-xl p-4 flex flex-col items-center justify-center transition shadow-md
                                     ${selectedLayout === l.id ? 'border-booth-accent bg-booth-dark' : 'border-booth-cream/10 bg-booth-bg'}
                                     ${!isHost ? 'opacity-80' : 'cursor-pointer'}`}>
                                    <h3 className="font-bold text-xl">{l.name}</h3>
                                    <p className="text-sm opacity-70 text-center">{l.desc}</p>
                                </div>
                            ))}
                        </div>
                        {isHost && (
                            <div className="mt-8 flex justify-center pb-8">
                                <button onClick={gotoSetupFrame} className="ticket-btn w-48 py-3">Next</button>
                            </div>
                        )}
                    </div>
                );
            }

            if (view === 'setup-frame') {
                return (
                    <div className="flex-1 flex flex-col p-6 max-w-md mx-auto w-full">
                        <h2 className="font-serif text-3xl text-center mb-2">Pick a frame</h2>
                        <p className="text-center opacity-70 mb-8">{isHost ? "Host: Tap one" : "Menunggu Host memilih..."}</p>
                        
                        <div className="grid grid-cols-2 gap-4 flex-1 overflow-y-auto hide-scrollbar">
                            {FRAMES.map(f => (
                                <div key={f.id} 
                                     onClick={() => selectFrame(f.id)}
                                     className={`border-4 rounded-xl h-48 transition flex flex-col items-center justify-end p-2 shadow-lg
                                     ${selectedFrame === f.id ? 'border-booth-accent' : 'border-booth-cream/10'} ${f.class}
                                     ${!isHost ? 'opacity-80' : 'cursor-pointer'}`}>
                                    <span className="bg-black/60 text-white px-3 py-1 rounded text-sm mb-2">{f.name}</span>
                                </div>
                            ))}
                        </div>
                        {isHost && (
                            <div className="mt-8 flex justify-center pb-8">
                                <button onClick={gotoBooth} className="ticket-btn w-48 py-3">Enter Booth</button>
                            </div>
                        )}
                    </div>
                );
            }

            if (view === 'booth') {
                return (
                    <div className="flex-1 flex flex-col items-center justify-center bg-black relative">
                        {/* Video Teman (Remote) akan tampil di atas */}
                        <video ref={remoteVideoRef} className="absolute inset-0 w-full h-full object-cover opacity-80" autoPlay playsInline></video>
                        
                        {/* Canvas Sendiri (Lokal) akan tampil di depan (ditimpa) karena background sudah transparan */}
                        <canvas ref={localCanvasRef} width="640" height="480" className="absolute inset-0 w-full h-full object-cover z-10"></canvas>
                        
                        <div className="absolute top-4 left-4 z-20 bg-black/50 text-white px-3 py-1 rounded-full text-sm">
                            {remoteStream ? "✅ Teman Terhubung" : "⏳ Menunggu video teman..."}
                        </div>

                        {countdown && (
                            <div className="absolute inset-0 flex items-center justify-center text-8xl font-bold text-white drop-shadow-2xl z-30" style={{ textShadow: '0 4px 20px rgba(0,0,0,0.5)' }}>
                                {countdown}
                            </div>
                        )}
                        
                        {isHost && isCameraReady && !countdown && photos.length === 0 && (
                            <div className="absolute bottom-12 z-30">
                                <button onClick={triggerPhotoSequence} className="w-20 h-20 bg-white rounded-full border-4 border-booth-accent shadow-[0_0_20px_rgba(225,125,107,0.8)] transition active:scale-90"></button>
                            </div>
                        )}
                        
                        {!isHost && !countdown && photos.length === 0 && (
                            <div className="absolute bottom-12 z-30 bg-black/60 px-4 py-2 rounded-full text-white">
                                Menunggu Host menekan tombol foto...
                            </div>
                        )}
                    </div>
                );
            }

            if (view === 'result') {
                const layoutObj = LAYOUTS.find(l => l.id === selectedLayout);
                const frameClass = FRAMES.find(f => f.id === selectedFrame).class;
                
                return (
                    <div className="flex-1 flex flex-col items-center p-6 overflow-y-auto">
                        <h2 className="font-serif text-3xl mb-6 mt-4">Your Photos</h2>
                        
                        <div className={`p-4 shadow-2xl rounded-md flex flex-col gap-2 ${frameClass}`} 
                             style={{ width: layoutObj.cols === 2 ? '300px' : '220px' }}>
                            
                            <div className={`grid gap-2`} style={{ gridTemplateColumns: `repeat(${layoutObj.cols}, minmax(0, 1fr))` }}>
                                {photos.map((p, i) => (
                                    <div key={i} className="aspect-[4/3] bg-booth-dark overflow-hidden relative shadow-inner">
                                        <img src={p} className="w-full h-full object-cover" />
                                    </div>
                                ))}
                            </div>
                            
                            <div className="text-center font-serif text-sm mt-3 font-bold text-black/60 tracking-widest">
                                ANGIE BOOTH
                            </div>
                        </div>
                        
                        <button onClick={() => window.location.reload()} className="mt-10 text-booth-cream border-2 border-booth-cream px-8 py-3 rounded font-bold uppercase tracking-wider">
                            Home
                        </button>
                    </div>
                );
            }

            return null;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
